<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#15213b">
<title>Shop</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header class="top">
  <button class="brand" id="brand" data-go="shop">Shop</button>
  <div class="search">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <label for="q" class="sr">Search products</label>
    <input id="q" type="search" placeholder="Search products" autocomplete="off">
  </div>
  <nav class="nav">
    <span class="chip hide-sm" id="wallet" hidden></span>
    <button class="ghost hide-sm" id="navOrders" data-go="orders" hidden>My orders</button>
    <button class="ghost" id="authBtn">Log in</button>
    <button class="icon cart-btn" id="cartBtn" aria-label="Open cart">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 7h12l-1 13H7L6 7Z"/><path d="M9 7a3 3 0 0 1 6 0"/></svg>
      <span class="count" id="count" hidden>0</span>
    </button>
  </nav>
</header>
<main id="view"></main>
<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-label="Cart" aria-hidden="true"></aside>
<dialog id="dlg"></dialog>
<div class="toasts" id="toasts" aria-live="polite"></div>
<script src="/shop.js"></script>
</body>
</html>
